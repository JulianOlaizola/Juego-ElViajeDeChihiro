buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  java.sourceCompatibility = 17
  java.targetCompatibility = 17

  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    File assetsFolder = new File("${project.rootDir}/assets/")
    File assetsFile = new File(assetsFolder, "assets.txt")
    assetsFile.delete()
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'ElViajeDeChihiro'
  repositories {
    mavenCentral()
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

tasks.register('jars', Copy) {
  group = 'build'
  description = 'Genera los .jar del cliente y del servidor y los copia en la carpeta entrega'
  dependsOn ':lwjgl3:jar', ':servidor:jar'
  from(project(':lwjgl3').layout.buildDirectory.dir('libs')) {
    include 'ElViajeDeChihiro-Cliente.jar'
  }
  from(project(':servidor').layout.buildDirectory.dir('libs')) {
    include 'ElViajeDeChihiro-Servidor.jar'
  }
  from(layout.projectDirectory.dir('scripts'))
  into(layout.projectDirectory.dir('entrega'))
}

eclipse.project.name = 'ElViajeDeChihiro' + '-parent'
